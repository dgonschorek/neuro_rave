[project]
name = "neuro-rave"
version = "0.1.0"
description = "RAVE and RAVE+: adversarial removal of domain (session) effects from time-series windows"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "dgonschorek", email = "dominic.gonschorek@cin.uni-tuebingen.de" }
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Only for examples/quickstart.ipynb; the package itself needs just torch and numpy.
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/dgonschorek/neuro_rave"
Paper = "https://proceedings.neurips.cc/paper_files/paper/2021/hash/1e5eeb40a3fce716b244599862fd2200-Abstract.html"
"Original implementation" = "https://github.com/eulerlab/rave"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuro_rave"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
    "/pyproject.toml",
]

# --- Ruff -------------------------------------------------------------------
# Single tool for linting, import sorting and formatting.

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (common bug patterns)
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.pep8-naming]
# Array-API convention: X for inputs, Z for embeddings.
extend-ignore-names = ["X", "X_*", "Z", "Z_*"]

[tool.ruff.lint.isort]
known-first-party = ["neuro_rave"]

[tool.ruff.format]
quote-style = "double"

# --- mypy --------------------------------------------------------------------
# Strict: every function in src/ is fully typed.

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

# --- pytest ------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
