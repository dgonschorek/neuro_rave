[project]
name = "neuro-rave"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dgonschorek", email = "dominic.gonschorek@cin.uni-tuebingen.de" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "lightning>=2.6.5",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
